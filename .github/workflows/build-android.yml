name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install Capacitor deps
        working-directory: mobile-app
        run: npm ci

      - name: Sync Capacitor Android (generates capacitor-cordova-android-plugins/ + capacitor.settings.gradle)
        working-directory: mobile-app
        run: npx cap sync android

      - name: Decode release keystore
        working-directory: mobile-app/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Make gradlew executable
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build debug APK (quick sanity check + installable test build)
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release AAB (upload this to Google Play)
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Build signed release APK (for direct install/testing, e.g. FLAG_SECURE verification)
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up decoded keystore
        if: always()
        working-directory: mobile-app/android
        run: rm -f app/release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ens-advantage-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ens-advantage-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk

      - name: Upload signed release AAB (upload this one to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ens-advantage-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
